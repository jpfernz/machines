server:
  port: 8082

spring:
  application:
    name: machines
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${jwk.set.uri}
  datasource:
#    url: jdbc:postgresql://worksite-db:5432/worksite-db # dockerized
    url: ${db.url} # Uncomment this line if you want to use the local database
    username: ${db.username}
    password: ${db.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha